name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  format:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1.10.0'

  test:
    name: Julia ${{ matrix.version }} (${{ matrix.threads }} thread(s))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            threads: 4
            coverage: true
          - version: '1'
            threads: 4
            coverage: false
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify Julia thread configuration
        run: |
          julia --project=. -e '
            expected = parse(Int, ENV["JULIA_NUM_THREADS"])
            Threads.nthreads(:default) == expected || error(
                "expected $expected Julia threads, got $(Threads.nthreads(:default))"
            )
          '
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - name: Process coverage
        if: matrix.coverage
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

  integration:
    name: Integration (4 threads)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run integration suite
        run: julia --project=. --threads=4 test/integration/runtests.jl

  performance-contracts:
    name: Performance contracts (1 thread)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run allocation and scaling contracts
        run: julia --project=. test/performance/runtests.jl

  makie-extension:
    name: Makie extension
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install headless Makie backend
        run: julia --project=. -e 'using Pkg; Pkg.add("CairoMakie")'
      - name: Test Makie extension
        run: julia --project=. test/makie_visualization.jl

  benchmark:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TWOPHASE_BENCHMARK_SAMPLES: '1'
      TWOPHASE_BENCHMARK_SECONDS: '0.01'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Exercise benchmark suite
        run: julia --project=benchmark benchmark/benchmarks.jl
      - name: Exercise fresh-process latency probe
        run: julia --project=benchmark benchmark/latency.jl
