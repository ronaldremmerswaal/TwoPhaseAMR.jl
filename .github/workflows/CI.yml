name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 3 * * 1' # Weekly integration
    - cron: '0 4 1 * *' # Monthly heavy tests
  workflow_dispatch:
    inputs:
      tier:
        description: Test tier to run (T1 also runs on dispatch; 'scaling' only measures thread scaling)
        type: choice
        required: true
        default: unit
        options: [unit, integration, heavy, all, scaling]

# Label events run in their own group and only start the integration tier, so
# they never cancel (or are cancelled by) the code run that reports ci-ok.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  OPENBLAS_NUM_THREADS: '1'
  JULIA_NUM_THREADS: '2'

jobs:
  format:
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1.10.0'

  unit:
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Default suite split by test/groups.jl UNIT_SHARDS (registry-checked),
        # on both the oldest supported Julia and the current stable one, so the
        # minimum version cannot rot outside PR checks.
        julia: ['1.11', '1.12']
        shard: [A, B, C, D, E]
    name: unit / ${{ matrix.shard }} (julia ${{ matrix.julia }})
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.julia == '1.12' }}
          test_args: 'shard:${{ matrix.shard }}'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia == '1.12'
      - uses: codecov/codecov-action@v7
        if: matrix.julia == '1.12'
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false

  contracts:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["performance"])'

  threading-equivalence:
    # Complete flows in fresh 1-, 2- and 4-thread processes with every loop
    # threaded: identical SHA-256 state hashes, step counts and warm-step
    # allocations. The group is not in the default suite because it starts its
    # own Julia processes.
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["threading_equivalence"])'

  thread-scaling:
    # Manual measurement tier: the ten target cases at 1, 2 and 4 threads.
    #   gh workflow run CI.yml --ref <branch> -f tier=scaling
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'scaling'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2, 4]
    name: Thread scaling / ${{ matrix.threads }} thread(s)
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Measure the target cases
        env:
          THREADS: ${{ matrix.threads }}
          STEPS: '20'
        run: |
          mkdir -p scaling
          for case in taylor_green taylor_green_fine cylinder cylinder_fine \
              capillary capillary_fine stokes3_one stokes3_one_fine \
              stokes3_two stokes3_two_fine; do
            echo "=== $case on $THREADS thread(s)"
            julia --project=. --threads="$THREADS" \
              benchmark/threading/scaling.jl "$case" "$STEPS" 0 | tee "scaling/$case.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: thread-scaling-${{ matrix.threads }}-threads
          path: scaling

  makie:
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=test/makie -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=test/makie test/makie_visualization.jl

  studio:
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.11', '1.12']
    env:
      JULIA_NUM_THREADS: '1,1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - run: julia --project=lib/TwoPhaseAMRStudio -e 'using Pkg; Pkg.test()'

  frontend:
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lib/TwoPhaseAMRStudio/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: lib/TwoPhaseAMRStudio/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run check:bundle

  studio-browser:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: '1,1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: lib/TwoPhaseAMRStudio/frontend/package-lock.json
      - run: julia --project=lib/TwoPhaseAMRStudio -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'
      - run: npm ci
        working-directory: lib/TwoPhaseAMRStudio/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: lib/TwoPhaseAMRStudio/frontend
      - run: npm run test:smoke
        working-directory: lib/TwoPhaseAMRStudio/frontend
      - run: npm run test:live-amr
        working-directory: lib/TwoPhaseAMRStudio/frontend
      - run: npm run test:examples
        working-directory: lib/TwoPhaseAMRStudio/frontend
      - run: npm run test:time-linear
        working-directory: lib/TwoPhaseAMRStudio/frontend

  benchmark:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      TWOPHASE_BENCHMARK_SAMPLES: '1'
      TWOPHASE_BENCHMARK_SECONDS: '0.01'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - run: julia --project=benchmark benchmark/benchmarks.jl
      - run: julia --project=benchmark benchmark/latency.jl

  integration:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["integration","all"]'), inputs.tier)) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration') && github.event.action != 'unlabeled' && (github.event.action != 'labeled' || github.event.label.name == 'run-integration'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Approximate historical totals: 10.2, 11.5, 11.5 minutes.
          - shard: A
            groups: integration/two_velocity_vortex integration/two_velocity_transport integration/staggered_wave_equation
          - shard: B
            groups: integration/two_phase_waves integration/two_phase_droplet integration/wave_equation integration/amr_manufactured_flow
          - shard: C
            groups: integration/two_phase_vortex integration/two_velocity_rotation integration/anisotropic_cells integration/two_phase_sessile_droplet
    name: Integration / ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Run integration groups
        env:
          GROUPS: ${{ matrix.groups }}
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=String.(split(ENV["GROUPS"])))'

  heavy:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 1 * *') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["heavy","all"]'), inputs.tier))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [integration/two_velocity_instabilities, integration/single_phase_cylinder]
    name: Heavy / ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Run heavy group
        env:
          GROUP: ${{ matrix.group }}
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=[ENV["GROUP"]])'

  ci-ok:
    # A run cancelled by a newer run on the same branch must not report a
    # failing ci-ok for its commit; the newer run reports the result.
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["unit","all"]'), inputs.tier))) }}
    needs: [format, unit, threading-equivalence, makie, studio, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all T0 checks to pass
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          EQUIVALENCE_RESULT: ${{ needs.threading-equivalence.result }}
          MAKIE_RESULT: ${{ needs.makie.result }}
          STUDIO_RESULT: ${{ needs.studio.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$FORMAT_RESULT" = success && test "$UNIT_RESULT" = success && test "$EQUIVALENCE_RESULT" = success && test "$MAKIE_RESULT" = success && test "$STUDIO_RESULT" = success && test "$FRONTEND_RESULT" = success
