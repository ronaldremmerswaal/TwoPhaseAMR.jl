name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  format:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1.10.0'

  test:
    name: Julia ${{ matrix.version }} (${{ matrix.threads }} thread(s))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.12'
            threads: 1
          - version: 'latest'
            threads: 4
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify Julia thread configuration
        run: |
          julia --project=. -e '
            expected = parse(Int, ENV["JULIA_NUM_THREADS"])
            Threads.nthreads(:default) == expected || error(
                "expected $expected Julia threads, got $(Threads.nthreads(:default))"
            )
          '
      - uses: julia-actions/julia-runtest@v1

  integration:
    name: Integration - ${{ matrix.name }} (4 threads)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vortex reversal
            script: two_phase_vortex.jl
          - name: two-velocity transport
            script: two_velocity_transport.jl
          - name: two-velocity rotating disc
            script: two_velocity_rotation.jl
          - name: continuous two-velocity vortex reversal
            script: two_velocity_vortex.jl
          - name: two-velocity KH and RT waves
            script: two_velocity_instabilities.jl
          - name: capillary and gravity waves
            script: two_phase_waves.jl
          - name: floating droplet
            script: two_phase_droplet.jl
          - name: sessile droplet
            script: two_phase_sessile_droplet.jl
    env:
      JULIA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify multi-thread kernel execution
        run: |
          julia --project=. --threads=4 -e '
            using Test, TwoPhaseAMR
            Threads.nthreads(:default) == 4 || error(
                "integration tests require four Julia threads"
            )
            include("test/threading.jl")
          '
      - name: Run ${{ matrix.name }} refinement study
        run: julia --project=. --threads=4 test/integration/${{ matrix.script }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
