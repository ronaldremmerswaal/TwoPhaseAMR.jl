name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  format:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1.10.0'

  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  integration:
    name: Two-phase integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Vortex reversal refinement
        run: julia --project test/integration/two_phase_vortex.jl
      - name: Capillary and gravity wave refinement
        run: julia --project test/integration/two_phase_waves.jl
      - name: Floating droplet equilibrium and frequency
        run: julia --project test/integration/two_phase_droplet.jl
      - name: Sessile droplet equilibrium refinement
        run: julia --project test/integration/two_phase_sessile_droplet.jl

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
