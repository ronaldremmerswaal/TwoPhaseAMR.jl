# Source classification. class:
#   equation      states a discretisation, operator or model (chapters required)
#   algebraic     linear-algebra/solver machinery documented as algebra
#   orchestration composes equation-bearing parts (stage order, options)
#   storage       data layout, state, diagnostics schedules (no equation)
